name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Momentum mntm-012
            slug: momentum
            sdk-url: https://up.momentum-fw.dev/builds/firmware/mntm-012/flipper-z-f7-sdk-mntm-012.zip
            sdk-channel: ""
          - name: Officiel release
            slug: officiel
            sdk-url: ""
            sdk-channel: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installation de ufbt et du SDK
        env:
          SDK_URL: ${{ matrix.sdk-url }}
          SDK_CHANNEL: ${{ matrix.sdk-channel }}
        run: |
          pip install --upgrade ufbt
          if [ -n "$SDK_URL" ]; then
            ufbt update --hw-target=f7 --url="$SDK_URL"
          else
            ufbt update --hw-target=f7 --channel="$SDK_CHANNEL"
          fi

      - name: Compilation
        run: ufbt

      - name: Contrôle du formatage
        run: ufbt lint

      - name: Nommage du .fap
        run: cp dist/mobipper.fap "mobipper-${{ matrix.slug }}.fap"

      - uses: actions/upload-artifact@v7
        with:
          name: mobipper-${{ matrix.slug }}
          path: mobipper-${{ matrix.slug }}.fap

  release:
    name: Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Notes de version (extrait du CHANGELOG)
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v v="## ${version} " 'index($0, v) == 1 {f = 1; next} /^## v/ {f = 0} f' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: Mobipper ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.fap
